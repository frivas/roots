name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  tooling:
    name: Tooling & CI config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Test repository tooling
        run: npm run test:tooling
      - name: Validate CI and runtime contracts
        run: npm run validate:ci-config

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # This job has its own checkout/install and consumes no lint artifacts, so
    # it can run alongside the other fail-fast gates.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Run frontend tests with coverage
        run: cd frontend && npm run test:coverage -- --reporter=json --outputFile=coverage/test-results.json
      - name: Run backend tests with coverage
        run: cd backend && npm run test:coverage -- --reporter=json --outputFile=coverage/test-results.json
      - name: Package exact-SHA coverage evidence
        if: github.event_name == 'push'
        env:
          COVERAGE_DRY_RUN: "1"
          COVERAGE_EVIDENCE_FILE: coverage-evidence/roots-coverage.json
          REPO: ${{ github.repository }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          COVERAGE_RUN_ID: ${{ github.run_id }}
          COVERAGE_WORKFLOW_REF: ${{ github.workflow_ref }}
          SOURCE_TARGET_BRANCH: ${{ github.ref_name }}
        run: npm run report:portfolio-coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            frontend/coverage/
            backend/coverage/
            coverage-evidence/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    # Build consumes source rather than test artifacts, so keep it independent
    # from unit tests to shorten the exact-SHA feedback loop.
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
      VITE_BACKEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            frontend/dist/
            backend/dist/
          retention-days: 3

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: [lint-typecheck, build]
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact-SHA checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .
      - run: npm run install:e2e-browsers
      - run: cd frontend && npm run test:e2e
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  notify-portfolio-coverage:
    name: Notify Portfolio coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PORTFOLIO_COVERAGE_DISPATCH_ENABLED == 'true'
    needs: [lint-typecheck, tooling, unit-tests, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dispatch exact green main SHA
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN is not configured; the hourly Portfolio fallback remains active."
            exit 0
          fi
          gh api --method POST repos/juan294/portfolio/dispatches \
            -f event_type=roots-coverage-ready \
            -F "client_payload[roots_sha]=${GITHUB_SHA}"
