name: Bundle Size

on:
  pull_request:
    branches: [develop, main]

permissions:
  pull-requests: write

jobs:
  analyze:
    name: Analyze Bundle
    runs-on: ubuntu-latest
    env:
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
      VITE_BACKEND_URL: http://localhost:3000
      VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY || 'gsk_placeholder' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Build frontend
        run: npm run build:frontend
      - name: Enforce bundle budgets
        id: size
        run: npm run check:bundle
      - name: Validate performance SLO contract
        run: npm run check:performance-slo:config
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-size
          message: |
            ## Bundle Size Report
            | Metric | Size |
            |--------|------|
            | Initial gzip | ${{ steps.size.outputs.initial_gzip_bytes }} / ${{ steps.size.outputs.initial_gzip_budget_bytes }} bytes |
            | Total JS/CSS gzip | ${{ steps.size.outputs.total_gzip_bytes }} / ${{ steps.size.outputs.total_gzip_budget_bytes }} bytes |
