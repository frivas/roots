name: Production health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  probe:
    name: Production health probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FRONTEND_HEALTH_URL: ${{ vars.NETLIFY_PRODUCTION_URL }}
      BACKEND_HEALTH_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
      HEALTH_EVIDENCE_FILE: health-evidence.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Probe both production runtimes and compare release identity
        run: node scripts/run-health-monitor.mjs
      - name: Upload structured health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-health-${{ github.run_id }}
          path: health-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Notify operations on probe failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_EVENT: roots_production_health_failed
        run: node scripts/send-operations-alert.mjs
