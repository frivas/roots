name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # weekly, so new CVEs in unchanged code still surface

permissions:
  contents: read

jobs:
  security:
    uses: frivas/.github/.github/workflows/security.yml@v1
    with:
      codeql-languages: '["javascript-typescript", "python", "actions"]'
