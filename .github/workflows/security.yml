name: Security Audit

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 9 * * 1' # Monday 9am UTC

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Enforce production audit policy
        env:
          AUDIT_EVIDENCE_DIR: audit-evidence
        run: npm run audit:production
      - name: Upload raw audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-audit-evidence
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 30

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Check licenses
        run: npm run license-check
